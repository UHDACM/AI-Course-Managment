[project]
name = "app"
version = "0.1.0"
description = "Using AI to use AI to do AI things, also AI. Pls give us money"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.124.4",
    "uvicorn[standard]>=0.22.0",
    "motor>=3.7.1",
    "pydantic[email]>=2.10.9",
    "pydantic-settings>=2.10.9",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
