[project]
name = "app"
version = "0.1.0"
description = "Using AI to use AI to do AI things, also AI. Pls give us money"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.124.4",
    "uvicorn[standard]>=0.22.0",
    "motor>=3.7.1",
    "pydantic>=2.10.9",
    "pydantic-settings>=2.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]